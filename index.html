<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>易得 · 资源服务</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            background: linear-gradient(145deg, #f8fafc 0%, #eef2f6 100%);
            color: #1e293b;
            overflow-x: hidden;
        }
        .app-wrapper {
            width: 100%;
            max-width: 480px;
            position: relative;
            padding: 20px 16px 20px;
        }
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .brand .logo {
            font-size: 32px;
            background: white;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .brand .text {
            display: flex;
            flex-direction: column;
        }
        .brand .text .name { font-weight: 700; font-size: 18px; color: #0f172a; }
        .brand .text .id { font-size: 13px; color: #64748b; }
        .hero {
            text-align: center;
            padding: 20px 0 24px;
        }
        .hero .mascot {
            font-size: 80px;
            display: block;
            margin: 0 auto 16px;
            line-height: 1;
        }
        .hero .big-title {
            font-size: 26px;
            font-weight: 700;
            color: #0f172a;
        }
        .hero .sub {
            color: #64748b;
            font-size: 14px;
            margin-top: 6px;
        }
        .grid-2x2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }
        .card-btn {
            background: #ffffff;
            border-radius: 20px;
            padding: 24px 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            border: none;
        }
        .card-btn:active { transform: scale(0.96); background: #f8fafc; }
        .card-btn .icon { font-size: 28px; display: block; margin-bottom: 6px; }
        .card-btn .label { font-weight: 600; font-size: 15px; color: #1e293b; }
        .list-drawer {
            background: #ffffff;
            border-radius: 24px;
            padding: 20px;
            display: none;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.04);
            max-height: 50vh;
            overflow-y: auto;
        }
        .list-drawer.open { display: block; }
        .drawer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            border-bottom: 1px solid #f1f5f9;
            padding-bottom: 12px;
        }
        .drawer-header h3 { font-size: 17px; }
        .drawer-header .close {
            font-size: 20px;
            cursor: pointer;
            color: #94a3b8;
            background: none;
            border: none;
        }
        .list-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #f8fafc;
        }
        .list-item:last-child { border-bottom: none; }
        .list-item .name { display: flex; align-items: center; gap: 6px; font-size: 15px; }
        .list-item .price { font-weight: 600; color: #b91c1c; }
        .footer {
            margin-top: 20px;
            padding: 16px;
            background: #ffffff;
            border-radius: 16px;
            text-align: center;
            font-size: 13px;
            color: #64748b;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            line-height: 1.6;
        }
        .footer .highlight { color: #2563eb; font-weight: 500; }
    </style>
</head>
<body>

    <div class="app-wrapper">
        <!-- 顶部：机器人🤖 Emoji 头像 -->
        <div class="navbar">
            <div class="brand">
                <div class="logo">🤖</div>
                <div class="text">
                    <span class="name">易得</span>
                    <span class="id">@Cctv365bot</span>
                </div>
            </div>
        </div>

        <!-- 英雄区：大号熊猫🐼 Emoji 代替图片 -->
        <div class="hero">
            <span class="mascot">🐼</span>
            <div class="big-title">生活所需 一应俱全</div>
            <div class="sub">有什么需求，交给我就好</div>
        </div>

        <!-- 分类 -->
        <div class="grid-2x2">
            <button class="card-btn" onclick="openDrawer('plane')">
                <span class="icon">✈️</span>
                <div class="label">飞机号</div>
            </button>
            <button class="card-btn" onclick="openDrawer('social')">
                <span class="icon">📧</span>
                <div class="label">社交账号</div>
            </button>
            <button class="card-btn" onclick="openDrawer('card')">
                <span class="icon">📞</span>
                <div class="label">实体卡</div>
            </button>
            <button class="card-btn" onclick="openDrawer('check')">
                <span class="icon">🔍</span>
                <div class="label">查档服务</div>
            </button>
        </div>

        <!-- 商品列表 -->
        <div id="drawer" class="list-drawer">
            <div class="drawer-header">
                <h3 id="drawerTitle">商品列表</h3>
                <button class="close" onclick="closeDrawer()">✕</button>
            </div>
            <div id="drawerContent"></div>
        </div>

        <div class="footer">
            请返回机器人界面下单<br>
            售后联系 <span class="highlight">@qishe77</span>
        </div>
    </div>

    <script>
        const allData = {
            plane: [
                { n: '🇺🇸 美国 (+1)', p: '¥50' }, { n: '🇨🇴 哥伦比亚 (+57)', p: '¥30' },
                { n: '🇵🇰 巴基斯坦 (+92)', p: '¥30' }, { n: '🇧🇩 孟加拉 (+880)', p: '¥35' },
                { n: '🇺🇿 乌兹别克斯坦 (+998)', p: '¥35' }, { n: '🇦🇷 阿根廷 (+54)', p: '¥38' }
            ],
            social: [
                { n: 'Google Gmail 老号', p: '¥68' }, { n: 'Facebook 老号', p: '¥35' },
                { n: 'Twitter 推特老号', p: '¥50' }, { n: 'Instagram 精品号', p: '¥88' }
            ],
            card: [
                { n: '🇵🇭 菲律宾卡', p: '¥27起' }, { n: '🇹🇭 泰国卡', p: '¥143起' },
                { n: '🇭🇰 香港卡', p: '¥55起' }, { n: '🇲🇾 马来卡', p: '¥43起' }
            ],
            check: [
                { n: '🔍 个人开房记录', p: '120U' }, { n: '📍 手机号查轨迹', p: '60U' },
                { n: '🚗 车辆行驶轨迹', p: '55U' }
            ]
        };

        function openDrawer(type) {
            const titles = { plane: '✈️ 飞机号', social: '📧 社交账号', card: '📞 实体卡', check: '🔍 查档服务' };
            document.getElementById('drawerTitle').textContent = titles[type] || '商品列表';
            const list = allData[type] || [];
            let html = '';
            list.forEach(item => {
                html += `<div class="list-item"><span class="name">${item.n}</span><span class="price">${item.p}</span></div>`;
            });
            document.getElementById('drawerContent').innerHTML = html;
            document.getElementById('drawer').classList.add('open');
        }

        function closeDrawer() {
            document.getElementById('drawer').classList.remove('open');
        }
    </script>
</body>
</html>
