<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>易得 · 资源服务</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            color: #ffffff;
            overflow-x: hidden;
            background-image: url('https://sfw.bar/qisheTV/photo_2025-08-16_21-17-15.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
        }
        .glass-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            z-index: -1;
        }
        .app-wrapper {
            width: 100%;
            max-width: 480px;
            position: relative;
            padding-bottom: 20px;
        }
        .navbar {
            position: sticky;
            top: 0;
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.25);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 10;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .brand .logo {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255,255,255,0.3);
        }
        .brand .text {
            display: flex;
            flex-direction: column;
        }
        .brand .text .name { font-weight: 700; font-size: 18px; color: #fff; }
        .brand .text .id { font-size: 12px; color: #e2e8f0; }
        /* 售后按钮（跳转 Safew 的 @qishe77） */
        .nav-btn {
            padding: 8px 16px;
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 20px;
            background: rgba(255,255,255,0.1);
            color: #fff;
            font-size: 14px;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.2s;
        }
        .nav-btn:active { background: rgba(255,255,255,0.25); }
        .hero {
            text-align: center;
            padding: 40px 20px 20px;
            position: relative;
        }
        .hero .mascot {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            object-fit: cover;
            margin: 0 auto 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            display: block;
            border: 3px solid rgba(255,255,255,0.3);
        }
        .hero .big-title {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 1px;
            color: #fff;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }
        .hero .sub {
            color: #e2e8f0;
            font-size: 15px;
            margin-top: 8px;
            line-height: 1.6;
            text-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }
        .grid-2x2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            padding: 20px;
        }
        .card-btn {
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            padding: 24px 16px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            color: #fff;
            backdrop-filter: blur(4px);
        }
        .card-btn:active { transform: scale(0.96); background: rgba(255,255,255,0.2); }
        .card-btn .icon { font-size: 28px; display: block; margin-bottom: 8px; }
        .card-btn .label { font-weight: 600; font-size: 15px; }
        .list-drawer {
            background: #ffffff;
            border-radius: 24px 24px 0 0;
            padding: 24px 20px;
            margin-top: 20px;
            color: #1e293b;
            display: none;
            box-shadow: 0 -4px 30px rgba(0,0,0,0.2);
            max-height: 60vh;
            overflow-y: auto;
        }
        .list-drawer.open { display: block; }
        .list-drawer .drawer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 12px;
            position: sticky;
            top: 0;
            background: #fff;
            z-index: 5;
        }
        .list-drawer .drawer-header h3 { font-size: 18px; }
        .list-drawer .close-drawer {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: #64748b;
        }
        .list-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #f1f5f9;
        }
        .list-item:last-child { border-bottom: none; }
        .list-item .name { display: flex; align-items: center; gap: 8px; font-size: 15px; }
        .list-item .price { font-weight: 600; color: #b91c1c; }
        .footer {
            padding: 20px;
            text-align: center;
            color: #e2e8f0;
            font-size: 12px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>

    <div class="glass-overlay"></div>

    <div class="app-wrapper">
        <div class="navbar">
            <div class="brand">
                <img class="logo" src="https://sfw.bar/qisheTV/photo_2025-08-16_21-17-15.jpg" alt="logo">
                <div class="text">
                    <span class="name">易得</span>
                    <span class="id">@Cctv365bot</span>
                </div>
            </div>
            <!-- 右上角售后按钮：跳转 Safew 的 @qishe77 -->
            <a href="https://sfw.bar/qishe77" class="nav-btn" target="_blank">售后</a>
        </div>

        <div class="hero">
            <img class="mascot" src="https://sfw.bar/qisheTV/photo_2025-08-16_21-17-15.jpg" alt="熊猫">
            <div class="big-title">生活所需 一应俱全</div>
            <div class="sub">有什么需求，交给我就好</div>
        </div>

        <div class="grid-2x2">
            <!-- 所有分类按钮统一跳转 Safew 的 @Cctv365bot -->
            <a href="https://sfw.bar/Cctv365bot" class="card-btn">
                <span class="icon">✈️</span>
                <div class="label">飞机号</div>
            </a>
            <a href="https://sfw.bar/Cctv365bot" class="card-btn">
                <span class="icon">📧</span>
                <div class="label">社交账号</div>
            </a>
            <a href="https://sfw.bar/Cctv365bot" class="card-btn">
                <span class="icon">📞</span>
                <div class="label">实体卡</div>
            </a>
            <a href="https://sfw.bar/Cctv365bot" class="card-btn">
                <span class="icon">🔍</span>
                <div class="label">查档服务</div>
            </a>
        </div>

        <div class="footer">
            售前售后全程跟进 · 联系 @qishe77
        </div>
    </div>

</body>
</html>
