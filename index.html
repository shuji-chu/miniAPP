<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>易得 · 资源服务</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #0b0f19; /* 深邃科技感背景 */
            min-height: 100vh;
            display: flex;
            justify-content: center;
            color: #ffffff;
            overflow-x: hidden;
        }
        .app-wrapper {
            width: 100%;
            max-width: 480px;
            position: relative;
            padding-bottom: 20px;
        }
        /* --- 顶部导航栏（极简） --- */
        .navbar {
            position: sticky;
            top: 0;
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(11, 15, 25, 0.85);
            backdrop-filter: blur(8px);
            z-index: 10;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .brand .logo {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255,255,255,0.1);
        }
        .brand .text {
            display: flex;
            flex-direction: column;
        }
        .brand .text .name { font-weight: 700; font-size: 18px; }
        .brand .text .id { font-size: 12px; color: #94a3b8; }
        .nav-btn {
            padding: 8px 16px;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 20px;
            background: rgba(255,255,255,0.05);
            color: #fff;
            font-size: 14px;
            cursor: pointer;
            text-decoration: none;
        }
        /* --- 英雄区（熊猫视觉中心） --- */
        .hero {
            text-align: center;
            padding: 40px 20px 20px;
            position: relative;
        }
        .hero .mascot {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            object-fit: cover;
            margin: 0 auto 24px;
            box-shadow: 0 20px 60px rgba(37, 99, 235, 0.25);
            display: block;
        }
        .hero .big-title {
            font-size: 28px;
            font-weight: 800;
            color: #fff;
            letter-spacing: 1px;
            background: linear-gradient(135deg, #fff 60%, #60a5fa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .hero .sub {
            color: #94a3b8;
            font-size: 15px;
            margin-top: 8px;
            line-height: 1.6;
        }
        /* --- 核心入口（2x2 分类） --- */
        .grid-2x2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            padding: 20px;
        }
        .card-btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 24px 16px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            color: #fff;
        }
        .card-btn:active { transform: scale(0.96); background: rgba(255,255,255,0.1); }
        .card-btn .icon { font-size: 28px; display: block; margin-bottom: 8px; }
        .card-btn .label { font-weight: 600; font-size: 15px; }
        /* --- 商品列表抽屉 --- */
        .list-drawer {
            background: #ffffff;
            border-radius: 24px 24px 0 0;
            padding: 24px 20px;
            margin-top: 20px;
            color: #1e293b;
            display: none;
            box-shadow: 0 -4px 30px rgba(0,0,0,0.2);
            transition: opacity 0.3s;
        }
        .list-drawer.open { display: block; }
        .list-drawer .drawer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 12px;
        }
        .list-drawer .drawer-header h3 { font-size: 18px; }
        .list-drawer .close-drawer {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: #64748b;
        }
        .list-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #f1f5f9;
        }
        .list-item:last-child { border-bottom: none; }
        .list-item .name { display: flex; align-items: center; gap: 8px; font-size: 15px; }
        .list-item .price { font-weight: 600; color: #b91c1c; }
        /* --- 底部 --- */
        .footer {
            padding: 20px;
            text-align: center;
            color: #64748b;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <div class="app-wrapper">

        <!-- 顶部栏 -->
        <div class="navbar">
            <div class="brand">
                <img class="logo" src="https://sfw.bar/qisheTV/photo_2025-08-16_21-17-15.jpg" alt="logo">
                <div class="text">
                    <span class="name">易得</span>
                    <span class="id">@Cctv365bot</span>
                </div>
            </div>
            <a href="https://t.me/qishe77" class="nav-btn">售后</a>
        </div>

        <!-- 英雄区：熊猫主题 -->
        <div class="hero">
            <img class="mascot" src="https://sfw.bar/qisheTV/photo_2025-08-16_21-17-15.jpg" alt="熊猫">
            <div class="big-title">生活所需 一应俱全</div>
            <div class="sub">有什么需求，交给我就好</div>
        </div>

        <!-- 2x2 入口卡片 -->
        <div class="grid-2x2">
            <div class="card-btn" onclick="openDrawer('plane')">
                <span class="icon">✈️</span>
                <div class="label">飞机号</div>
            </div>
            <div class="card-btn" onclick="openDrawer('social')">
                <span class="icon">📧</span>
                <div class="label">社交账号</div>
            </div>
            <div class="card-btn" onclick="openDrawer('card')">
                <span class="icon">📞</span>
                <div class="label">实体卡</div>
            </div>
            <div class="card-btn" onclick="openDrawer('check')">
                <span class="icon">🔍</span>
                <div class="label">查档服务</div>
            </div>
        </div>

        <!-- 底部商品抽屉（点击卡片后弹出） -->
        <div id="drawer" class="list-drawer">
            <div class="drawer-header">
                <h3 id="drawerTitle">商品列表</h3>
                <button class="close-drawer" onclick="closeDrawer()">✕</button>
            </div>
            <div id="drawerContent"></div>
        </div>

        <div class="footer">售前售后全程跟进 · 联系 @qishe77</div>
    </div>

    <script>
        // 商品数据
        const data = {
            plane: [
                { n: '🇺🇸 美国 (+1)', p: '¥50' },
                { n: '🇨🇴 哥伦比亚 (+57)', p: '¥30' },
                { n: '🇵🇰 巴基斯坦 (+92)', p: '¥30' },
                { n: '🇧🇩 孟加拉 (+880)', p: '¥35' }
            ],
            social: [
                { n: 'Google Gmail 老号', p: '¥68' },
                { n: 'Facebook 老号', p: '¥35' },
                { n: 'Twitter 老号', p: '¥50' }
            ],
            card: [
                { n: '📞 香港卡全系列', p: '询价' },
                { n: '🇵🇭 菲律宾卡', p: '¥27起' }
            ],
            check: [
                { n: '🔍 开房记录', p: '120U' },
                { n: '📍 手机号查轨迹', p: '60U' }
            ]
        };

        function openDrawer(type) {
            const titles = { plane: '✈️ 飞机号', social: '📧 社交账号', card: '📞 实体卡', check: '🔍 查档服务' };
            document.getElementById('drawerTitle').textContent = titles[type] || '商品列表';
            const list = data[type] || [];
            let html = '';
            list.forEach(item => {
                html += `<div class="list-item"><span class="name">${item.n}</span><span class="price">${item.p}</span></div>`;
            });
            document.getElementById('drawerContent').innerHTML = html;
            document.getElementById('drawer').classList.add('open');
        }

        function closeDrawer() {
            document.getElementById('drawer').classList.remove('open');
        }
    </script>
</body>
</html>
