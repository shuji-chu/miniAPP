<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>易得 · 资源服务</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            color: #ffffff;
            overflow-x: hidden;
            background-image: url('https://sfw.bar/qisheTV/photo_2025-08-16_21-17-15.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
        }
        .glass-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            z-index: -1;
        }
        .app-wrapper {
            width: 100%;
            max-width: 480px;
            position: relative;
            padding-bottom: 20px;
        }
        .navbar {
            position: sticky;
            top: 0;
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 10;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .brand .logo {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255,255,255,0.3);
        }
        .brand .text {
            display: flex;
            flex-direction: column;
        }
        .brand .text .name { font-weight: 700; font-size: 18px; }
        .brand .text .id { font-size: 12px; color: #e2e8f0; }
        .hero {
            text-align: center;
            padding: 40px 20px 20px;
            position: relative;
        }
        .hero .mascot {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            object-fit: cover;
            margin: 0 auto 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            display: block;
            border: 3px solid rgba(255,255,255,0.2);
        }
        .hero .big-title {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 1px;
            color: #fff;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }
        .hero .sub {
            color: #e2e8f0;
            font-size: 15px;
            margin-top: 8px;
            line-height: 1.6;
            text-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }
        .grid-2x2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            padding: 20px;
        }
        .card-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            padding: 24px 16px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            color: #fff;
            backdrop-filter: blur(4px);
            /* 点击不用跳转 */
        }
        .card-btn:active { transform: scale(0.96); background: rgba(255,255,255,0.2); }
        .card-btn .icon { font-size: 28px; display: block; margin-bottom: 8px; }
        .card-btn .label { font-weight: 600; font-size: 15px; }
        .list-drawer {
            background: #ffffff;
            border-radius: 24px 24px 0 0;
            padding: 24px 20px;
            margin-top: 20px;
            color: #1e293b;
            display: none;
            box-shadow: 0 -4px 30px rgba(0,0,0,0.2);
            max-height: 60vh;
            overflow-y: auto;
        }
        .list-drawer.open { display: block; }
        .list-drawer .drawer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 12px;
            position: sticky;
            top: 0;
            background: #fff;
            z-index: 5;
        }
        .list-drawer .drawer-header h3 { font-size: 18px; }
        .list-drawer .close-drawer {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: #64748b;
        }
        .list-item {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #f1f5f9;
        }
        .list-item:last-child { border-bottom: none; }
        .list-item .name { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 500; }
        .list-item .price { font-weight: 600; color: #b91c1c; }
        .footer {
            padding: 20px;
            text-align: center;
            color: #e2e8f0;
            font-size: 13px;
            line-height: 1.8;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }
        .footer .highlight { color: #fbbf24; font-weight: 500; }
    </style>
</head>
<body>

    <div class="glass-overlay"></div>

    <div class="app-wrapper">
        <div class="navbar">
            <div class="brand">
                <img class="logo" src="https://sfw.bar/qisheTV/photo_2025-08-16_21-17-15.jpg" alt="logo">
                <div class="text">
                    <span class="name">易得</span>
                    <span class="id">@Cctv365bot</span>
                </div>
            </div>
        </div>

        <div class="hero">
            <img class="mascot" src="https://sfw.bar/qisheTV/photo_2025-08-16_21-17-15.jpg" alt="熊猫">
            <div class="big-title">生活所需 一应俱全</div>
            <div class="sub">有什么需求，交给我就好</div>
        </div>

        <div class="grid-2x2">
            <div class="card-btn" onclick="openDrawer('plane')">
                <span class="icon">✈️</span>
                <div class="label">飞机号</div>
            </div>
            <div class="card-btn" onclick="openDrawer('social')">
                <span class="icon">📧</span>
                <div class="label">社交账号</div>
            </div>
            <div class="card-btn" onclick="openDrawer('card')">
                <span class="icon">📞</span>
                <div class="label">实体卡</div>
            </div>
            <div class="card-btn" onclick="openDrawer('check')">
                <span class="icon">🔍</span>
                <div class="label">查档服务</div>
            </div>
        </div>

        <div id="drawer" class="list-drawer">
            <div class="drawer-header">
                <h3 id="drawerTitle">商品列表</h3>
                <button class="close-drawer" onclick="closeDrawer()">✕</button>
            </div>
            <div id="drawerContent"></div>
        </div>

        <div class="footer">
            请返回机器人界面下单<br>
            售后联系 <span class="highlight">@qishe77</span>
        </div>
    </div>

    <script>
        // 所有商品数据完整保留
        const allData = {
            plane: [
                { n: '🇺🇸 美国 (+1)', p: '¥50' }, { n: '🇨🇴 哥伦比亚 (+57)', p: '¥30' },
                { n: '🇵🇰 巴基斯坦 (+92)', p: '¥30' }, { n: '🇧🇩 孟加拉 (+880)', p: '¥35' },
                { n: '🇺🇿 乌兹别克斯坦 (+998)', p: '¥35' }, { n: '🇦🇷 阿根廷 (+54)', p: '¥38' },
                { n: '🇨🇱 智利 (+56)', p: '¥38' }, { n: '🇻🇳 越南 (+84)', p: '¥38' },
                { n: '🇮🇱 以色列 (+972)', p: '¥38' }, { n: '🇹🇿 坦桑尼亚 (+255)', p: '¥38' }
            ],
            social: [
                { n: 'Google Gmail 老号', p: '¥68' }, { n: 'Facebook 老号', p: '¥35' },
                { n: 'Twitter 推特老号', p: '¥50' }, { n: 'Instagram 精品号', p: '¥88' },
                { n: 'Discord 老号', p: '¥66' }, { n: 'TikTok 各国账号', p: '¥20' }
            ],
            card: [
                { n: '🇵🇭 菲律宾卡', p: '¥27起' }, { n: '🇹🇭 泰国卡', p: '¥143起' },
                { n: '🇭🇰 香港卡', p: '¥55起' }, { n: '🇲🇾 马来卡', p: '¥43起' },
                { n: '🇬🇧 英国卡', p: '¥56起' }, { n: '🇮🇩 印尼卡', p: '¥53起' }
            ],
            check: [
                { n: '🔍 个人开房记录', p: '120U' }, { n: '📍 手机号查轨迹', p: '60U' },
                { n: '🚗 车辆行驶轨迹', p: '55U' }, { n: '📞 手机通话记录', p: '78U' }
            ]
        };

        function openDrawer(type) {
            const titles = { plane: '✈️ 飞机号', social: '📧 社交账号', card: '📞 实体卡', check: '🔍 查档服务' };
            document.getElementById('drawerTitle').textContent = titles[type] || '商品列表';
            const list = allData[type] || [];
            let html = '';
            list.forEach(item => {
                html += `<div class="list-item"><span class="name">${item.n}</span><span class="price">${item.p}</span></div>`;
            });
            document.getElementById('drawerContent').innerHTML = html;
            document.getElementById('drawer').classList.add('open');
        }

        function closeDrawer() {
            document.getElementById('drawer').classList.remove('open');
        }
    </script>
</body>
</html>
