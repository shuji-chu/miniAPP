<!DOCTYPE html>
<html lang="zh-CN">
<head>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            background: linear-gradient(145deg, #f8fafc 0%, #eef2f6 100%);
            color: #1e293b;
            overflow-x: hidden;
        }
        .app-wrapper {
            width: 100%;
            max-width: 480px;
            position: relative;
            padding: 20px 16px 20px;
        }
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .brand .logo {
            font-size: 32px;
            background: white;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .brand .text {
            display: flex;
            flex-direction: column;
        }
        .brand .text .name { font-weight: 700; font-size: 18px; color: #0f172a; }
        .brand .text .id { font-size: 13px; color: #64748b; }
        .hero {
            text-align: center;
            padding: 20px 0 24px;
        }
        .hero .mascot {
            font-size: 80px;
            display: block;
            margin: 0 auto 16px;
            line-height: 1;
        }
        .hero .big-title {
            font-size: 26px;
            font-weight: 700;
            color: #0f172a;
        }
        .hero .sub {
            color: #64748b;
            font-size: 14px;
            margin-top: 6px;
        }
        .grid-2x2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }
        .card-btn {
            background: #ffffff;
            border-radius: 20px;
            padding: 24px 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            border: none;
        }
        .card-btn:active { transform: scale(0.96); background: #f8fafc; }
        .card-btn .icon { font-size: 28px; display: block; margin-bottom: 6px; }
        .card-btn .label { font-weight: 600; font-size: 15px; color: #1e293b; }
        .list-drawer {
            background: #ffffff;
            border-radius: 24px;
            padding: 20px;
            display: none;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.04);
            max-height: 50vh;
            overflow-y: auto;
        }
        .list-drawer.open { display: block; }
        .drawer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            border-bottom: 1px solid #f1f5f9;
            padding-bottom: 12px;
        }
        .drawer-header h3 { font-size: 17px; }
        .drawer-header .close {
            font-size: 20px;
            cursor: pointer;
            color: #94a3b8;
            background: none;
            border: none;
        }
        .list-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #f8fafc;
        }
        .list-item:last-child { border-bottom: none; }
        .list-item .name { display: flex; align-items: center; gap: 6px; font-size: 15px; }
        .list-item .price { font-weight: 600; color: #b91c1c; }
        .footer {
            margin-top: 20px;
            padding: 16px;
            background: #ffffff;
            border-radius: 16px;
            text-align: center;
            font-size: 13px;
            color: #64748b;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            line-height: 1.6;
        }
        .footer .highlight { color: #2563eb; font-weight: 500; }
    </style>

        function closeDrawer() {
